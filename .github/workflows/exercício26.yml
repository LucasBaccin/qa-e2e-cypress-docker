name: Exercício do módulo 26

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout do repositório de testes
      uses: actions/checkout@v4
      with:
        path: projeto-testes

    - name: Checkout do hub de leitura
      uses: actions/checkout@v4
      with:
        repository: LucasBaccin/hub-de-leitura-integrado
        path: hub-de-leitura

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: |
            hub-de-leitura/package-lock.json
            projeto-testes/package-lock.json

    - name: Instalar dependências do hub de leitura
      working-directory: hub-de-leitura
      run: npm install

    - name: Iniciar o hub de leitura
      working-directory: hub-de-leitura
      run: npm start &

    - name: Aguardar o hub de leitura iniciar
      run: npx wait-on http://127.0.0.1:3000 --timeout=10000

    - name: Instalar dependências do repositório de testes
      working-directory: projeto-testes
      run: npm install

    - name: Executar os testes
      working-directory: projeto-testes
      run: npx cypress run